name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cron schedule (Vercel Hobby ≤ daily)
        run: npm run check:cron

      # 🔴 sst.config.ts のトップレベル import は SST が設定を読む時点で落ちるが、
      #    tsc も eslint も通してしまう（＝ここで止めないと deploy まで分からない）。
      #    deploy は main への push でしか走らないので、PR で止まる場所に置く。
      - name: SST config (no top-level imports)
        run: npm run check:sst-config

      # 🔴 **`tsconfig.json` は `exclude` に sst.config.ts を入れている**ので、
      #    下の `npx tsc --noEmit` は sst.config.ts を **1行も検査していない**
      #    （実測: `npx tsc --noEmit --listFilesOnly | grep -c sst.config.ts` が 0）。
      #    exclude してあるのは `$config` / `sst` / `aws` の型を供給する
      #    `.sst/platform/config.d.ts` が `sst install` 生成＝gitignore 対象で、
      #    チェックアウト直後には存在しないため。専用の tsconfig.sst.json でだけ検査する。
      #
      # 🔑 だから `sst install` を先に打って型を生成する。providers を入れるだけなので
      #    **AWS 資格情報は要らない＝ PR（fork 含む）でも走る**。これを省くと型が無くて
      #    「常に赤い」ステップになり、本物の型エラーと区別が付かなくなる。
      #
      #    これが無いと sst.config.ts の型エラーを止める場所がどこにも無く、
      #    `SST Deploy`（main への push＝**本番**に入る）まで到達する。
      #    ＝ 検査は「壊れたことが分かる場所」ではなく「壊す前に止まる場所」に置く。
      - name: SST config (type check)
        run: |
          npx sst install
          npm run check:sst

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    env:
      # E2E は本番 URL に対して実行（または省略）
      PLAYWRIGHT_BASE_URL: ${{ vars.PLAYWRIGHT_BASE_URL }}
      # DynamoDB へのアクセスが不要なモック環境では空で可
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}

      # サーバの起動・準備完了待ち・タイムアウトは Playwright の webServer 機構に一任する。
      # 起動失敗時は job が確実に落ちるため、以前の curl 待ちループのような取りこぼし
      # （ERR_CONNECTION_REFUSED のまま続行）が起きない。
      - name: Run E2E tests
        run: npm run e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Pour Over 9.5: main への push で AWS へも自動デプロイする。
  #
  # なぜ要るか: 14（soak）では Vercel と AWS の両方が本番を担う。Vercel は main の
  # 自動デプロイが有効なので、AWS 側にこれが無いと **push のたびに Vercel だけが進み、
  # 本番を担う AWS が取り残される**（依存 K）。加えてデプロイが「npm 11 の入った
  # 特定のマシンからの手打ち」に固定されたままになる。
  #
  # 資格情報は OIDC で都度発行する＝**静的な AWS キーをリポジトリに置かない**。
  # ロールの作成は scripts/bootstrap-github-oidc.sh（1回だけ・AWS 側の前提作業）。
  deploy:
    name: SST Deploy (${{ matrix.stage }})
    runs-on: ubuntu-latest
    # テストが通っていないものを本番に出さない。13 以降はこの gate が本番を守る。
    needs: [lint-typecheck, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        # 🔴 デプロイ先はここ1か所で決める（sst.config.ts の WAF_STAGES / CRON_STAGES と
        #    同じ運用）。
        # ✅ **'production' を足した（2026-08-02・13-4 の DNS 切替後＝5-4）**。
        #    足す条件だった「13 で DNS を切り替えた後」は満たしている
        #    （切替は 2026-08-02T19:39:15Z・Route53 の SubmittedAt が正本）。
        # 🔴 **ここから main への push は本番に入る。** 9.5 の「マージ順が実害を持つ」は
        #    これ以降 dev ではなく**本番**の話になる。gate は needs: [lint-typecheck, e2e] の1本だけ。
        # 📌 fail-fast: false なので dev が落ちても production は走る（逆も同じ）。
        #    ステージは独立に扱う＝片方の失敗でもう片方を巻き込まない。
        stage: [dev, production]
    permissions:
      id-token: write # OIDC トークンの発行に必須（既定では付かない）
      contents: read
    concurrency:
      # SST の state ロックは1ステージ1本。並走すると後発が state ロックで落ちる。
      # 🔴 cancel-in-progress は false。デプロイ中に打ち切ると state がロックされたまま残る。
      group: sst-deploy-${{ matrix.stage }}
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # node 22 に同梱される npm は 10 系。npm 10 で入れた依存で OpenNext をビルドすると
      # sharp が wasm32 に落ち、next/image が無言で最適化されなくなる
      # （検知するのが scripts/check-build-toolchain.mjs＝下の ①）。
      # 依存の導入も 11 で行う（package.json の allowScripts に一本化済み）。
      - name: Use npm 11
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      # 未設定のまま走ると configure-aws-credentials が読み解きにくいエラーで落ちるので、
      # 何をすればよいかが分かる形で先に止める。
      - name: Check deploy role is configured
        run: |
          if [ -z "${{ vars.AWS_DEPLOY_ROLE_ARN }}" ]; then
            echo "✗ リポジトリ変数 AWS_DEPLOY_ROLE_ARN が未設定です。" >&2
            echo "  bash scripts/bootstrap-github-oidc.sh を1度実行してください。" >&2
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      # 入口は `npm run sst:deploy` の1つだけ（0-a）。素の `npx sst deploy` にすると
      # ツールチェーン検査と画像最適化の検証が両方抜ける。
      # 🔴 パイプに通さないこと。終了ステータスが後段のものに化け、失敗が exit 0 になる（教訓23）。
      - name: SST deploy
        run: npm run sst:deploy -- --stage ${{ matrix.stage }}
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY || 'sk_test_placeholder' }}
